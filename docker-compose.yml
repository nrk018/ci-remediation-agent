services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci_remediation
    ports:
      - "5432:5432"
    volumes:
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci -d ci_remediation"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ci:ci@db:5432/ci_remediation
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
